<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>aleink</title>
    <script>
      // Truque padrão para rodar uma SPA (React Router) no GitHub Pages:
      // reescreve a URL como query string e redireciona para o index.html,
      // que depois restaura a URL real (ver script em index.html).
      var pathSegmentsToKeep = 1 // mantém "/aleink-ecommerce" no caminho
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
